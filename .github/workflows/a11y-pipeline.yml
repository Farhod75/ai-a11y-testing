name: AI Accessibility Testing Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  accessibility-audit:
    name: 🔍 AI Accessibility Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pytest pytest-html

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Playwright Accessibility Scan
        env:
          BASE_URL: 'https://dequeuniversity.com/demo/mars/'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx playwright test --grep "@a11y" --reporter=list
        continue-on-error: true

      - name: Run Claude AI Analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx ts-node scripts/analyze-with-claude.ts
        continue-on-error: true

      - name: Run pytest Assertions
        run: pytest tests/ -v --html=reports/pytest-report.html --self-contained-html
        continue-on-error: true

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-reports-${{ github.sha }}
          path: reports/
          retention-days: 30
      - name: Send Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npx ts-node scripts/slack-notifier.ts
        if: always()